name: Immutable same-run release inputs
description: Download existing named route/context/candidate/proof artifacts without executing their content.
inputs:
  baseline:
    default: "true"
    description: Include accepted baseline context
  candidate:
    default: "false"
    description: Include exact tested candidate
  preview:
    default: "false"
    description: Include preview proof
  hosted:
    default: "false"
    description: Include successful hosted acceptance
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: repformed-release-route
        path: route
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: inputs.baseline == 'true'
      with:
        name: repformed-current-baseline
        path: baseline-context
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: inputs.candidate == 'true'
      with:
        name: repformed-auto-candidate
        path: candidate
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: inputs.preview == 'true'
      with:
        name: repformed-auto-preview-proof
        path: proof
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: inputs.hosted == 'true'
      with:
        name: repformed-auto-hosted-acceptance
        path: proof
