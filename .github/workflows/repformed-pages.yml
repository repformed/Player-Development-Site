name: Repformed Pages release
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [preview, promote]
        default: preview
        required: true
      confirm_source_sha:
        description: Exact public source SHA (public candidate 253e6b72d6c996d0d3b92b31776d794baea7959a)
        type: string
        required: true
      expected_production_id:
        description: Independently verified current production deployment ID
        type: string
        default: 46157695-dd12-4522-b25e-abcdce6e4fa9
        required: true
      preview_run_id:
        description: Successful preview run ID, required for promotion
        type: string
      confirm_manifest_digest:
        description: Full manifest digest from preview receipt, required for promotion
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: repformed-pages-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'repformed/Player-Development-Site' && github.ref == 'refs/heads/main' && inputs.stage == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Test trusted deployment controller without credentials
        run: node --test control/scripts/tests/pages-release.test.mjs control/scripts/tests/pages-preview-bytes.test.mjs
      - name: Validate explicit source selection
        env:
          CONFIRMED: ${{ inputs.confirm_source_sha }}
        working-directory: control
        run: node -e 'const t=require("./.github/pages-release/target.json"); if(process.env.CONFIRMED!==t.sourceSha) process.exit(1)'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: repformed/Player-Development-Site
          ref: ${{ inputs.confirm_source_sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Check actual source identity and public ancestry
        env:
          CONFIRMED: ${{ inputs.confirm_source_sha }}
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$CONFIRMED"
          git merge-base --is-ancestor 5e86084e30c871c3ae79c1f4d3000f9c6dfadb16 HEAD
          test "$(git rev-parse HEAD^{tree})" = "$(node -p 'require("../control/.github/pages-release/target.json").sourceTreeSha')"
      - name: Install and validate without deployment credentials
        working-directory: source
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
          node ../control/scripts/run-pages-fixture-checks.mjs . e2e artifacts/fixture-isolation-e2e.json
          node ../control/scripts/run-pages-fixture-checks.mjs . app artifacts/fixture-isolation-app.json
      - name: Package verified bytes (never rebuild during promotion)
        run: |
          mkdir -p candidate
          cp -a source/dist candidate/site
          cp source/artifacts/fixture-isolation-e2e.json candidate/fixture-e2e.json
          cp source/artifacts/fixture-isolation-app.json candidate/fixture-app.json
          node control/scripts/pages-release.mjs verify candidate/site candidate/build.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repformed-public-candidate
          path: candidate/
          retention-days: 7
          if-no-files-found: error
  preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repformed-public-candidate
          path: candidate
      - name: Install pinned existing Pages CLI without credentials
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix control/.github/pages-release/tools
      - name: Verify target and upload public preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.REPFORMED_PAGES_API_TOKEN }}
          CONFIRM_SOURCE_SHA: ${{ inputs.confirm_source_sha }}
          EXPECTED_PRODUCTION_ID: ${{ inputs.expected_production_id }}
          PAGES_CLI: ${{ github.workspace }}/control/.github/pages-release/tools
        run: node control/scripts/pages-release.mjs preview candidate/site proof/preview.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repformed-preview-proof
          path: proof/preview.json
          retention-days: 7
          if-no-files-found: error
  verify_preview:
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          ref: ${{ inputs.confirm_source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repformed-public-candidate
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repformed-preview-proof
          path: proof
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install source browser tools without deployment credentials
        working-directory: source
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify hosted asset bytes and consumed header configuration
        env:
          DEMO_BASE_URL: ${{ needs.preview.outputs.url }}
          CONFIRM_SOURCE_SHA: ${{ inputs.confirm_source_sha }}
          EXPECTED_PRODUCTION_ID: ${{ inputs.expected_production_id }}
        run: node control/scripts/verify-pages-preview-bytes.mjs candidate/build.json proof/preview.json proof/verified-preview.json
      - name: Verify public preview with contained fictional backend only
        working-directory: source
        env:
          DEMO_BASE_URL: ${{ needs.preview.outputs.url }}
          EXPECTED_PRODUCTION_ID: ${{ inputs.expected_production_id }}
        run: node ../control/scripts/run-pages-fixture-checks.mjs . hosted ../proof/fixture-hosted.json ../proof/preview.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repformed-hosted-acceptance
          path: proof/
          retention-days: 7
          if-no-files-found: error
  promote:
    if: github.repository == 'repformed/Player-Development-Site' && github.ref == 'refs/heads/main' && inputs.stage == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repformed-public-candidate
          run-id: ${{ inputs.preview_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repformed-preview-proof
          run-id: ${{ inputs.preview_run_id }}
          github-token: ${{ github.token }}
          path: proof
      - name: Install pinned existing Pages CLI without credentials
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix control/.github/pages-release/tools
      - name: Promote exact successful preview bytes after explicit confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.REPFORMED_PAGES_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CONFIRM_SOURCE_SHA: ${{ inputs.confirm_source_sha }}
          EXPECTED_PRODUCTION_ID: ${{ inputs.expected_production_id }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          CONFIRM_MANIFEST_DIGEST: ${{ inputs.confirm_manifest_digest }}
          PREVIEW_PROOF: ${{ github.workspace }}/proof/preview.json
          PAGES_CLI: ${{ github.workspace }}/control/.github/pages-release/tools
        run: node control/scripts/pages-release.mjs promote candidate/site proof/production.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repformed-production-proof
          path: proof/production.json
          retention-days: 30
          if-no-files-found: error
