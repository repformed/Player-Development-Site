name: iPhone app build and simulator tests
on:
  workflow_dispatch:
    inputs:
      closed_gate:
        description: Build a backend-disabled unsigned validation candidate
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify the selected Apple toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Install and bundle the mobile app
        env:
          PD_IOS_CLOSED_GATE: ${{ inputs.closed_gate }}
        run: |
          npm ci
          if [ "$PD_IOS_CLOSED_GATE" = "true" ]; then
            node scripts/build-ios-closed.mjs
          else
            npm run build:ios
          fi
      - name: Generate Xcode test targets
        run: |
          brew install xcodegen
          cd ios/App
          xcodegen generate
      - name: Build and test on an iPhone simulator
        run: |
          mkdir -p mobile-builds
          xcodebuild -version
          xcrun simctl list devices available --json > mobile-builds/simulators.json
          PD_SIMULATOR_UDID=$(python3 -c 'import json;d=json.load(open("mobile-builds/simulators.json"));choices=[(tuple(map(int,k.split("iOS-")[1].split("-"))),x["name"]=="iPhone 17 Pro",x["udid"]) for k,v in d["devices"].items() if "iOS-" in k for x in v if x["name"].startswith("iPhone") and x.get("isAvailable")];print(max(choices)[2])')
          echo "$PD_SIMULATOR_UDID" > mobile-builds/simulator-udid.txt
          xcrun simctl boot "$PD_SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$PD_SIMULATOR_UDID" -b
          set -o pipefail
          xcodebuild test -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination "platform=iOS Simulator,id=$PD_SIMULATOR_UDID" -derivedDataPath mobile-builds/DerivedData -resultBundlePath mobile-builds/iPhone-tests.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- | tee mobile-builds/simulator-build.log
          if [ "${{ inputs.closed_gate }}" = "true" ]; then
            python3 scripts/verify-closed-ios.py mobile-builds/DerivedData/Build/Products/Debug-iphonesimulator/App.app mobile-builds/closed-ios-input.json > mobile-builds/closed-ios-simulator.json
          fi
          xcrun simctl launch "$PD_SIMULATOR_UDID" com.coachbilliott.playerdevelopment
          xcrun simctl io "$PD_SIMULATOR_UDID" screenshot mobile-builds/iPhone-app.png
          ditto -c -k --sequesterRsrc --keepParent mobile-builds/DerivedData/Build/Products/Debug-iphonesimulator/App.app mobile-builds/PlayerDevelopment-iOS-Simulator.app.zip
      - name: Archive an unsigned iPhone device build
        run: |
          set -o pipefail
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath mobile-builds/PlayerDevelopment.xcarchive -derivedDataPath mobile-builds/DeviceDerivedData CODE_SIGNING_ALLOWED=NO | tee mobile-builds/device-build.log
          if [ "${{ inputs.closed_gate }}" = "true" ]; then
            python3 scripts/verify-closed-ios.py mobile-builds/PlayerDevelopment.xcarchive/Products/Applications/App.app mobile-builds/closed-ios-input.json > mobile-builds/closed-ios-device.json
          fi
          ditto -c -k --sequesterRsrc --keepParent mobile-builds/PlayerDevelopment.xcarchive mobile-builds/PlayerDevelopment-unsigned.xcarchive.zip
      - name: Export simulator test reports and screenshots
        if: always()
        run: |
          if [ -d mobile-builds/iPhone-tests.xcresult ]; then
            xcrun xcresulttool export attachments --path mobile-builds/iPhone-tests.xcresult --output-path mobile-builds/test-screenshots || true
            xcrun xcresulttool get test-results summary --path mobile-builds/iPhone-tests.xcresult > mobile-builds/native-test-summary.json || true
          fi
      - name: Save native builds, screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-development-ios-test-build
          path: |
            mobile-builds/*.zip
            mobile-builds/*.png
            mobile-builds/*.log
            mobile-builds/*.json
            mobile-builds/*.txt
            mobile-builds/*.xcresult/
            mobile-builds/test-screenshots/
          retention-days: 14
