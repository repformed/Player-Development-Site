name: Repformed automatic public release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'push' && 'repformed-pages-release' || format('repformed-public-review-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false
env:
  PUBLIC_CONTROL_SHA: "874444b8a1e6d8f37a2e5f70ef93c26948e28d6d"
  PUBLIC_AUTO_SOURCE_SHA: ${{ github.sha }}
jobs:
  review_read_capability:
    name: Read existing public review metadata
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLIC_CONTROL_SHA }}
          path: control
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Check existing token read capability without provider access
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REVIEW_PR: ${{ github.event.pull_request.number }}
        run: node control/scripts/pages-review-capability.mjs "$PUBLIC_REVIEW_PR"
  route:
    name: Authenticate exact release route
    if: github.event_name == 'push' && github.repository == 'repformed/Player-Development-Site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      kind: ${{ steps.route.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLIC_CONTROL_SHA }}
          path: control
          persist-credentials: false
      - uses: ./control/.github/actions/release-source
      - name: Classify and read exact review without installing source packages
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: node control/scripts/pages-routed-release.mjs route source route/route.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repformed-release-route
          path: route/
          retention-days: 7
          if-no-files-found: error
  documents:
    name: Verify documentation without deployment
    needs: route
    if: needs.route.outputs.kind == 'reader-documentation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLIC_CONTROL_SHA }}
          path: control
          persist-credentials: false
      - uses: ./control/.github/actions/release-source
      - uses: ./control/.github/actions/release-inputs
        with:
          baseline: "false"
      - name: Require complete ordinary CI and current exact review
        env:
          GH_TOKEN: ${{ github.token }}
        run: node control/scripts/pages-routed-release.mjs docs source route/route.json proof/documentation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repformed-docs-acceptance
          path: proof/
          retention-days: 30
          if-no-files-found: error
  baseline:
    name: Capture accepted production baseline
    needs: route
    if: contains(fromJSON('["public-feature","development-dependencies","controller-bootstrap"]'), needs.route.outputs.kind)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.baseline.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLIC_CONTROL_SHA }}
          path: control
          persist-credentials: false
      - uses: ./control/.github/actions/release-source
      - uses: ./control/.github/actions/release-inputs
        with:
          baseline: "false"
      - name: Read and bind accepted production
        id: baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.REPFORMED_PAGES_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node control/scripts/pages-routed-release.mjs baseline source route/route.json baseline-context/baseline.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repformed-current-baseline
          path: baseline-context/
          retention-days: 7
          if-no-files-found: warn
  tests:
    name: Test exact source without credentials
    needs: [route, baseline]
    if: needs.baseline.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLIC_CONTROL_SHA }}
          path: control
          persist-credentials: false
      - uses: ./control/.github/actions/release-source
      - uses: ./control/.github/actions/release-inputs
      - name: Install without repository or provider credentials
        working-directory: source
        env:
          RELEASE_KIND: ${{ needs.route.outputs.kind }}
        run: |
          npm ci --ignore-scripts
          ln -s ../source/node_modules ../control/node_modules
      - name: Test exact source without repository or provider credentials
        working-directory: source
        run: |
          test ! -e artifacts/public-compiler-inventory.json
          npm run lint
          npm run typecheck
          npm test
          npm run build
          PUBLIC_TEST_SOURCE="$PWD" PUBLIC_TEST_SITE="$PWD/dist" node --test ../control/scripts/tests/pages-*.test.mjs
          npx playwright install --with-deps chromium
          node ../control/scripts/run-pages-fixture-checks.mjs . e2e artifacts/fixture-e2e.json
          node ../control/scripts/run-pages-fixture-checks.mjs . app artifacts/fixture-app.json
      - name: Install controller-pinned syntax tools without credentials
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix control/.github/pages-release/analysis-tools
      - name: Bind complete tested bytes and containment receipts
        run: node control/scripts/pages-routed-release.mjs tested source route/route.json baseline-context/baseline.json source/artifacts/tested-build.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repformed-source-test-proof
          path: |
            source/artifacts/fixture-*
            source/artifacts/tested-build.json
          retention-days: 7
          if-no-files-found: error
  build:
    name: Compile exact tested source on fresh runner
    needs: [route, baseline, tests]
    if: needs.baseline.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLIC_CONTROL_SHA }}
          path: control
          persist-credentials: false
      - uses: ./control/.github/actions/release-source
      - uses: ./control/.github/actions/release-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repformed-source-test-proof
          path: source/artifacts
      - name: Fresh locked compilation without tests or credentials
        working-directory: source
        run: |
          test ! -e artifacts/public-compiler-inventory.json
          npm ci --ignore-scripts
          npm run build
      - name: Install controller-pinned syntax tools without credentials
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix control/.github/pages-release/analysis-tools
      - name: Bind fresh compiler bytes to complete tested inventory
        run: |
          mkdir -p candidate
          node control/scripts/pages-routed-release.mjs manifest source route/route.json baseline-context/baseline.json candidate/build.json
          cp -a source/dist candidate/site
          cp source/artifacts/fixture-* candidate/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repformed-auto-candidate
          path: candidate/
          retention-days: 7
          if-no-files-found: error
  preview:
    name: Preview exact public artifact
    needs: [route, baseline, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.preview.outputs.url }}
      ready: ${{ steps.preview.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLIC_CONTROL_SHA }}
          path: control
          persist-credentials: false
      - uses: ./control/.github/actions/release-source
      - uses: ./control/.github/actions/release-inputs
        with:
          candidate: "true"
      - name: Download authenticated prior artifacts without source execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: node control/scripts/pages-routed-release.mjs download-baseline source route/route.json baseline-context/baseline.json baseline
      - name: Install controller-pinned syntax tools without credentials
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix control/.github/pages-release/analysis-tools
      - name: Validate candidate and dependency comparison without credentials
        run: node control/scripts/pages-routed-release.mjs prepare source route/route.json baseline-context/baseline.json candidate/build.json candidate/site baseline
      - name: Install existing pinned Pages CLI without provider credentials
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix control/.github/pages-release/tools
      - name: Capture fresh baseline and upload verified public preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.REPFORMED_PAGES_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PAGES_CLI: ${{ github.workspace }}/control/.github/pages-release/tools
        run: node control/scripts/pages-routed-release.mjs preview source route/route.json baseline-context/baseline.json candidate/build.json candidate/site baseline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repformed-auto-preview-proof
          path: proof/
          retention-days: 7
          if-no-files-found: warn
  verify_preview:
    name: Verify exact hosted public artifact
    needs: [route, build, preview]
    if: needs.preview.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLIC_CONTROL_SHA }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repformed-auto-candidate
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repformed-auto-preview-proof
          path: proof
      - name: Install browser tools without provider credentials
        working-directory: source
        env:
          RELEASE_KIND: ${{ needs.route.outputs.kind }}
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify all served bytes and effective configured headers
        env:
          DEMO_BASE_URL: ${{ needs.preview.outputs.url }}
        run: node control/scripts/pages-auto-release.mjs hosted candidate/build.json proof/preview.json proof/verified-preview.json
      - name: Verify public interactions with contained fictional backend
        working-directory: source
        env:
          DEMO_BASE_URL: ${{ needs.preview.outputs.url }}
        run: |
          export EXPECTED_PRODUCTION_ID="$(node -p 'require("../proof/preview.json").baseline')"
          node ../control/scripts/run-pages-fixture-checks.mjs . hosted ../proof/fixture-hosted.json ../proof/preview.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repformed-auto-hosted-acceptance
          path: proof/
          retention-days: 7
          if-no-files-found: warn
  promote:
    name: Promote exact public artifact
    needs: [route, baseline, build, preview, verify_preview]
    if: needs.preview.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PUBLIC_CONTROL_SHA }}
          path: control
          persist-credentials: false
      - uses: ./control/.github/actions/release-source
      - uses: ./control/.github/actions/release-inputs
        with:
          candidate: "true"
          hosted: "true"
      - name: Download authenticated prior artifacts without source execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: node control/scripts/pages-routed-release.mjs download-baseline source route/route.json baseline-context/baseline.json baseline
      - name: Install controller-pinned syntax tools without credentials
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix control/.github/pages-release/analysis-tools
      - name: Validate candidate and dependency comparison without credentials
        run: node control/scripts/pages-routed-release.mjs prepare source route/route.json baseline-context/baseline.json candidate/build.json candidate/site baseline
      - name: Install existing pinned Pages CLI without provider credentials
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix control/.github/pages-release/tools
      - name: Promote only exact successful preview bytes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.REPFORMED_PAGES_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PAGES_CLI: ${{ github.workspace }}/control/.github/pages-release/tools
        run: node control/scripts/pages-routed-release.mjs promote source route/route.json baseline-context/baseline.json candidate/build.json candidate/site baseline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repformed-auto-production-proof
          path: proof/
          retention-days: 30
          if-no-files-found: warn
