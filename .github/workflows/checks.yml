name: Prototype checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: node --test scripts/tests/pages-release.test.mjs scripts/tests/pages-preview-bytes.test.mjs
      - run: npx --yes deno@2.5.6 check backend/functions/account-lifecycle/index.ts
      - run: npx --yes deno@2.5.6 check backend/functions/staff-notifications/index.ts
      - run: npx --yes deno@2.5.6 check backend/functions/interest-intake/index.ts
      - run: npm test
      - run: python3 -m unittest discover -s scripts/tests
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-pages-fixture-checks.mjs . e2e artifacts/fixture-isolation-e2e.json
      - run: node scripts/run-pages-fixture-checks.mjs . app artifacts/fixture-isolation-app.json
      - run: npx playwright test --config playwright.private-preview.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            playwright-report-app/
          retention-days: 7
